name: MLB Stats Daily Update

on:
  # Offseason: the schedule trigger is disabled so this no longer runs automatically.
  # To restore the daily run next season, uncomment the schedule block below.
  # schedule:
  #   - cron: '0 11 * * *'
  workflow_dispatch:   # triggered by external cron via PAT

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Write FanGraphs cookie
        run: echo '${{ secrets.FANGRAPHS_COOKIE }}' > fg_cookie.txt

      # Refreshes espn_rosters.json (rosters + team records the standings tab
      # reads) before the dashboard build. fetch_espn_rosters.py exits 0 on
      # failure and does not replace a good file. The `||` is a backstop if
      # the interpreter dies before that handler runs.
      - name: Refresh ESPN rosters and standings
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python fetch_espn_rosters.py || echo "::warning::ESPN roster/standings refresh failed; keeping the previous espn_rosters.json so the dashboard build can continue."

      - name: Generate MLB stats dashboard
        env:
          SKIP_AUTO_INSTALL: "1"
        run: xvfb-run python fetch_mlb_stats.py

      - name: Commit updated dashboard to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Daily stats update $(date +%F)"
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git push origin main

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npm install -g firebase-tools@13.35.1 --silent
          n=0
          until [ "$n" -ge 3 ]; do
            firebase deploy --only hosting --non-interactive --project mlb-stats-ae429 && break
            n=$((n+1))
            echo "Firebase deploy attempt $n failed; retrying in 15s..."
            sleep 15
          done
          if [ "$n" -ge 3 ]; then
            echo "Firebase deploy failed after 3 attempts"
            exit 1
          fi
