name: MLB Stats Daily Update

on:
  schedule:
    # Target: ready by ~noon EDT. GitHub delays scheduled runs 2-3 hrs on free repos.
    # Scheduling at 7:00 AM EDT (11:00 UTC) so even a 3-hr delay fires by 10 AM EDT.
    - cron: '0 11 * * *'
  workflow_dispatch:   # lets you trigger a manual run from GitHub UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps
          sudo apt-get install -y xvfb

      - name: Write FanGraphs cookie
        run: echo '${{ secrets.FANGRAPHS_COOKIE }}' > fg_cookie.txt

      - name: Generate MLB stats dashboard
        env:
          SKIP_AUTO_INSTALL: "1"
        run: xvfb-run python fetch_mlb_stats.py

      - name: Commit updated dashboard to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Daily stats update $(date +%F)"
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git push origin main

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npm install -g firebase-tools@13 --silent
          firebase deploy --only hosting --non-interactive --project mlb-stats-ae429
