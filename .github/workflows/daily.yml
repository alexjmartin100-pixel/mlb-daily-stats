name: MLB Stats Daily Update

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fetch_mlb_stats.py'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - run: pip install -r requirements.txt

      - run: echo '${{ secrets.FANGRAPHS_COOKIE }}' > fg_cookie.txt

      - run: python fetch_mlb_stats.py
        env:
          SKIP_AUTO_INSTALL: "1"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_daily_stats.html
          git diff --cached --quiet || git commit -m "Daily stats update $(date -u +'%Y-%m-%d')"
          git push

      - run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npm install -g firebase-tools@13 --silent
          firebase deploy --only hosting --non-interactive --project mlb-stats-ae429
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
